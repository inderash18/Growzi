name: Growzi CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Lint, Schema Verification, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint Checks
        run: npm run lint

      - name: Build Next.js Production Package
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/growzi"
          NEXT_PUBLIC_SUPABASE_URL: "https://growzi-mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mockKey"
          SUPABASE_SERVICE_ROLE_KEY: "mockServiceRoleKey"
